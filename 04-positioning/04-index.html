  Lesson 04: CSS Positioning

-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Positioning</title>
  <link rel="stylesheet" href="04-style.css" />
</head>
<body>

  <div class="spacer"></div> <!-- Scroll space to test fixed behavior -->
  

</body>
</html>
