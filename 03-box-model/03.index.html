<!--
  Lesson 03: CSS Box Model
  This lesson shows how margin, padding, border, and content make up the box model.
  Each section has distinct styles applied so you can see how spacing and borders affect layout.
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <link rel="stylesheet" href="03-style.css" />
  </head>
  <body>
    <h1>Box Model Demo</h1>

    <div class="box-border-only">
      <p>Box with border only (no padding or margin)</p>
    </div>

    <div class="box-padding-only">
      <p>Box with padding only</p>
    </div>

    <div class="box-margin-only">
      <p>Box with margin only</p>
    </div>

    <div class="box-full">
      <p>Box with margin, border, and padding</p>
    </div>
  </body>
</html>
