<!-- 
  Lesson 08: Responsive Design
  - Mobile-first design.
  - Media queries are used to adjust the layout for mobile, tablet, and desktop.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Design Example</title>
  <link rel="stylesheet" href="08-style.css" />
</head>
<body>

  <header>
    <div class="logo">Logo</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to Our Website</h1>
      <p>Responsive design is essential for modern web development.</p>
    </section>
    <section class="content">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Example Corp</p>
  </footer>

</body>
</html>
