<!-- 
  Lesson 07: Combined Layout using Grid and Flexbox
  - Grid is used for the full-page layout (rows and columns)
  - Flexbox is used inside the header and footer for alignment
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combined Layout</title>
  <link rel="stylesheet" href="07-style.css" />
</head>
<body>

  <div class="grid-container">
    <!-- Flexbox used inside the header -->
    <header class="header">
      <div class="logo">🌟Logo</div>
      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <aside class="sidebar">
      <p>Sidebar Content</p>
    </aside>

    <main class="main">
      <h1>Main Content</h1>
      <p>This is the main area using Grid layout.</p>
    </main>

    <!-- Flexbox used inside the footer -->
    <footer class="footer">
      <p>&copy; 2025</p>
      <p>Footer Links</p>
    </footer>
  </div>

</body>
</html>
